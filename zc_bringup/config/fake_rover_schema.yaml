# Wire layout of the fake rover (zc-drivers::fake::FakeRover).
# Field order here == byte order on the wire. Keep in sync with
# FakeRoverState / FakeRoverCommand in zc-drivers/src/fake.rs.
state_interfaces:
  left_wheel_joint:
    position: float64
    velocity: float64
  right_wheel_joint:
    position: float64
    velocity: float64
command_interfaces:
  left_wheel_joint:
    velocity: float64
  right_wheel_joint:
    velocity: float64
