# ESP32-S3 firmware: fake rover over WiFi. Own workspace (esp toolchain + build-std).
[workspace]

[package]
name = "zc-esp32s3"
description = "Z Control firmware for the ESP32-S3: fake two-wheel rover for zenbedded_hardware_interface"
edition = "2024"
rust-version = "1.91.0"
version = "0.1.0"
license = "Apache-2.0"
publish = false

[features]
default = []
# Timing loopback device (zc-drivers::fake::Echo) instead of the fake rover,
# for examples/latency_probe.
echo = []

[dependencies]
zc-core = { path = "../../zc-core", features = ["defmt"] }
zc-drivers = { path = "../../zc-drivers" }
zenoh-embassy = { git = "https://github.com/eclipse-zenoh/zenoh-nostd", rev = "e88f73a00c9825f5467918c271ee8f1b67f0f771" }

embassy-executor = { version = "0.9.1", features = ["defmt"] }
embassy-time = "0.5.0"
embassy-net = { version = "0.8.0", features = ["defmt", "dhcpv4", "medium-ethernet", "tcp", "udp"] }
static_cell = "2.1.1"
heapless = { version = "0.8", default-features = false }
defmt = "1.0"
getrandom = { version = "0.2.16", features = ["custom"] }

esp-hal = { version = "1.0.0", features = ["defmt", "esp32s3", "unstable"] }
esp-rtos = { version = "0.2.0", features = ["defmt", "esp32s3", "esp-radio", "esp-alloc", "embassy"] }
esp-radio = { version = "0.17.0", features = ["unstable", "defmt", "esp-alloc", "esp32s3", "smoltcp", "wifi"] }
esp-alloc = { version = "0.9.0", features = ["defmt"] }
esp-println = { version = "0.16.1", features = ["defmt-espflash", "esp32s3"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["defmt", "esp32s3"] }

[profile.dev]
# Debug builds are too slow for WiFi; always build with --release.
opt-level = "s"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 2  # symbols for defmt/backtraces, not flashed

# Nagle off / no delayed ACK on the device TCP socket, see ../../patches/README.md
[patch."https://github.com/eclipse-zenoh/zenoh-nostd"]
zenoh-embassy = { path = "../../patches/zenoh-embassy" }
